name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 still defaults to the removed "tools" package. Gradle installs the SDK packages it needs.
          packages: platform-tools

      - name: Install ffmpeg and mpv for real-engine and Echo gateway tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv

      - name: All JVM tests, database migrations, desktop packaging, Android builds and lint
        env:
          KAINOS_GAPLESS_STRESS: "1"
        run: |
          chmod +x gradlew
          # The shallow checkout counts one commit. CI artifacts are never shipped.
          ./gradlew jvmTest :core:playback:testAndroidHostTest :core:data:verifyCommonMainKainosDatabaseMigration :desktopApp:createDistributable :androidApp:assembleDebug :androidApp:assembleOptimized :androidApp:lintDebug -PkainosVersionCode=${{ github.run_number }} --stacktrace

      - name: Launcher and release gate tests
        run: |
          python3 scripts/tests/test_launcher.py
          python3 scripts/tests/test_android_release_gate.py

      - uses: astral-sh/setup-uv@v6

      - name: Echo gateway tests in isolated environment
        working-directory: tools/echo-gateway
        run: |
          uv venv "$RUNNER_TEMP/kainos-echo-tests"
          uv pip install --python "$RUNNER_TEMP/kainos-echo-tests/bin/python" -r requirements.txt pytest
          "$RUNNER_TEMP/kainos-echo-tests/bin/python" -m pytest -q -p no:cacheprovider

      - name: Secret scan
        run: |
          if git ls-files | grep -qxE 'secrets\.properties|signing\.properties|.*\.(jks|keystore|p12)'; then
            echo "secrets.properties, signing.properties and keystores must stay gitignored"
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY' -- . ':!.github' ; then
            echo "Private key material is checked in"
            exit 1
          fi
          echo "No tracked secrets, signing keys or private keys"
