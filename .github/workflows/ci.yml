name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 still defaults to the removed "tools" package. Gradle installs the SDK packages it needs.
          packages: platform-tools

      - name: Shared tests, desktop compile, Android debug build and lint
        run: |
          chmod +x gradlew
          ./gradlew :shared:jvmTest :desktopApp:compileKotlinJvm :androidApp:assembleDebug :androidApp:lintDebug --stacktrace

      - name: Secret scan
        run: |
          if git ls-files | grep -qx 'secrets.properties'; then
            echo "secrets.properties must stay gitignored"
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY' -- . ':!.github' ; then
            echo "Private key material is checked in"
            exit 1
          fi
          echo "No tracked secrets.properties or private keys"
